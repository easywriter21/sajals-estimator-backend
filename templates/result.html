<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Estimation Result</h1>

    <table>
        {% for key, value in result.items() %}
        <tr>
            <td><b>{{ key }}</b></td>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

    <form action="/download-excel/" method="post">
        <button>Download Excel</button>
    </form>

    <a href="/">Back</a>
</div>

</body>
</html>
